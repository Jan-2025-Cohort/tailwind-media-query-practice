<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Responsive Card Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl font-bold mb-4 text-center">Team Members</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Card 1 -->
      <div class="bg-white p-4 rounded shadow">
        <img src="https://via.placeholder.com/150" class="w-full rounded mb-4" alt="Profile">
        <h2 class="text-xl font-semibold">Jane Doe</h2>
        <p class="text-gray-600">Front-End Developer</p>
      </div>

      <!-- Card 2 -->
      <div class="bg-white p-4 rounded shadow">
        <img src="https://via.placeholder.com/150" class="w-full rounded mb-4" alt="Profile">
        <h2 class="text-xl font-semibold">John Smith</h2>
        <p class="text-gray-600">Back-End Developer</p>
      </div>

      <!-- Card 3 -->
      <div class="bg-white p-4 rounded shadow">
        <img src="https://via.placeholder.com/150" class="w-full rounded mb-4" alt="Profile">
        <h2 class="text-xl font-semibold">Alex Ray</h2>
        <p class="text-gray-600">UI/UX Designer</p>
      </div>
    </div>
  </div>
</body>
</html>
